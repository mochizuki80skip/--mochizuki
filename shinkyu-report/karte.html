<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f6fb2" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="karte.css" />
  <script src="fonts.js"></script>
  <title>カルテ枚数計算</title>
</head>
<body>
  <header class="topbar">
    <h1>カルテ枚数計算</h1>
    <nav class="topbar-nav">
      <a class="btn" href="./">鍼施術内容書へ</a>
    </nav>
  </header>

  <main class="view">
    <section class="panel kc-step">
      <h2><span class="step">1</span>レセコンの顧客リストを読み込む</h2>
      <p class="hint">レセコンから書き出した顧客（患者）一覧の CSV または Excel ファイルを選んでください。
        ファイルはこの端末の中だけで計算し、<b>サーバーには送りません</b>。</p>
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".csv,.txt,.tsv,.xlsx,.xls" hidden />
        <span id="dropText">ここにファイルをドラッグ、またはタップして選ぶ</span>
      </label>
    </section>

    <section class="panel kc-step" id="secColumns" hidden>
      <h2><span class="step">2</span>列を確認する</h2>
      <div class="grid2">
        <label class="field">カルテ番号の列
          <select id="colNo"></select>
        </label>
        <label class="field">氏名の列（任意・確認用）
          <select id="colName"></select>
        </label>
      </div>
      <div class="kc-opts">
        <label class="chk"><input type="checkbox" id="optHeader" checked /> 1行目は見出し</label>
        <label class="chk"><input type="checkbox" id="optZero" checked /> 先頭の0は無視する（000125x と 125 を同じにする）</label>
      </div>
      <p class="hint">まとめ方：カルテ番号の<b>数字の部分</b>が同じものを1枚と数えます。
        例）125・125a・125x・125r（労災）・000125x → すべて「125」の1枚</p>
      <div class="preview-table" id="rawPreview"></div>
    </section>

    <section id="secResult" hidden>
      <section class="panel">
        <h2><span class="step">3</span>結果</h2>
        <div class="kc-stats">
          <div class="stat"><div class="stat-label">レセコンの件数（行数）</div><div class="stat-num" id="stRows">-</div></div>
          <div class="stat main"><div class="stat-label">正確なカルテ枚数（被りを除いた顧客数）</div><div class="stat-num" id="stUnique">-</div></div>
          <div class="stat"><div class="stat-label">枝番をまとめて減った数</div><div class="stat-num" id="stMerged">-</div></div>
        </div>
        <p class="hint" id="stNote"></p>

        <div class="kc-compare">
          <label class="field">予約システムのカルテ枚数（比較用）
            <input type="number" id="cmpBooking" min="0" inputmode="numeric" placeholder="例：1520" />
          </label>
          <div id="cmpResult" class="cmp-result"></div>
        </div>
      </section>

      <section class="panel">
        <h2>確認用の一覧</h2>
        <div class="tabs" role="tablist">
          <button type="button" class="btn small active" data-tab="merged">まとめたカルテ <span id="cntMerged"></span></button>
          <button type="button" class="btn small" data-tab="all">全カルテ <span id="cntAll"></span></button>
          <button type="button" class="btn small" data-tab="names">同じ氏名で番号が違う <span id="cntNames"></span></button>
          <button type="button" class="btn small" data-tab="odd">決まりと違う番号 <span id="cntOdd"></span></button>
          <button type="button" class="btn small" data-tab="bad">番号が読めない行 <span id="cntBad"></span></button>
        </div>
        <input type="search" id="search" class="kc-search" placeholder="番号（例：100）や氏名で探す" />
        <p class="hint" id="tabHint"></p>
        <div class="table-wrap"><table class="kc-table" id="detailTable"></table></div>
        <div class="edit-actions left">
          <button type="button" class="btn" id="btnCsv">正確なカルテ一覧を CSV で保存</button>
        </div>
      </section>
    </section>
  </main>

  <script src="karte.js"></script>
</body>
</html>
