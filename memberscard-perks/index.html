/* ===== ユーティリティ ===== */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function findPartner(id) {
  for (var i = 0; i < PARTNERS.length; i++) if (PARTNERS[i].id === id) return PARTNERS[i];
  return null;
}
function mapUrl(addr) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr);
}
function prefsOf(p) {
  var out = [];
  p.stores.forEach(function (s) { if (out.indexOf(s.pref) < 0) out.push(s.pref); });
  return out;
}
function currentPath() {
  var id = location.hash.replace(/^#/, "");
  return findPartner(id) ? "/" + id : "/top";
}

/* ===== 計測 ===== */
var DEBUG = /[?&]debug=1/.test(location.search);
function track(name, params) {
  params = params || {};
  if (DEBUG) console.log("[track]", name, params);
  if (window.GA_ENABLED) gtag("event", name, params);
}

var scrollSent = {};
function resetScrollDepth() { scrollSent = {}; }
function checkScrollDepth() {
  var doc = document.documentElement;
  var max = doc.scrollHeight - window.innerHeight;
  var pct = max <= 0 ? 100 : Math.round((window.scrollY / max) * 100);
  [25, 50, 75, 100].forEach(function (p) {
    if (pct >= p && !scrollSent[p]) {
      scrollSent[p] = true;
      track("scroll_depth", { percent: p, page_path: currentPath() });
    }
  });
}
var scrollTimer = null;
window.addEventListener("scroll", function () {
  if (scrollTimer) return;
  scrollTimer = setTimeout(function () { scrollTimer = null; checkScrollDepth(); }, 200);
}, { passive: true });

/* タップの委任
   - data-track があれば、そのイベント（line_click / tel_click など）を送る
   - さらに、すべてのリンク・ボタンのタップを ui_tap として送る（どこが押されたかの把握用）
     tap_id   : data-tap、無ければ data-track と data-loc から作る
     section  : 近くの data-section（how / partners / banner / perks / stores など）
     tap_text : ボタンやリンクの文言（先頭40文字） */
document.addEventListener("click", function (e) {
  var el = e.target.closest("a, button, [data-tap]");
  if (!el) return;

  var name = el.getAttribute("data-track");
  if (name) {
    var p = {};
    if (el.hasAttribute("data-loc")) p.cta_location = el.getAttribute("data-loc");
    if (el.hasAttribute("data-partner")) p.partner = el.getAttribute("data-partner");
    if (el.hasAttribute("data-store")) p.store = el.getAttribute("data-store");
    if (el.hasAttribute("data-pref")) p.pref = el.getAttribute("data-pref");
    track(name, p);
  }

  var sec = el.closest("[data-section]");
  var tapId = el.getAttribute("data-tap") ||
    [name, el.getAttribute("data-loc") || el.getAttribute("data-pref") || el.getAttribute("data-store") || el.getAttribute("data-partner")].filter(Boolean).join(":") ||
    (el.getAttribute("href") || el.tagName.toLowerCase());
  track("ui_tap", {
    tap_id: tapId.slice(0, 100),
    tap_text: (el.textContent || el.getAttribute("aria-label") || "").replace(/\s+/g, " ").trim().slice(0, 40),
    section: sec ? sec.getAttribute("data-section") : "",
    page_path: currentPath()
  });
});


/* ===== 描画 ===== */
var app = document.getElementById("app");
var heroTitle = document.getElementById("hero-title");
var heroLead = document.getElementById("hero-lead");

    '</section>' +

    '<section class="section" data-section="partners" aria-labelledby="partners-title">' +
      '<h2 class="section-title" id="partners-title">提携店舗・事業</h2>' +
      '<div class="partners">' + partnersHtml + '</div>' +

    '</section>' +

    '<section class="section" data-section="banner" aria-labelledby="banner-title">' +

        '<img src="' + esc(IMG.banner) + '" width="900" height="506" alt="80SKIP公式LINEでMEMBER\'S CARDを受け取る" data-fallback="80SKIP公式LINEでMEMBER\'S CARDを受け取る">' +
      '</a>' +
      '<p class="small muted" style="margin-top:10px">80SKIP公式LINEを友だち追加すると、MEMBER\'S CARDを受け取れます。バナーをタップするとLINEが開きます。</p>' +

function storeHtml(p, s) {
  var hours = (s.wd === s.we || !s.we)
    ? '<dt>営業時間</dt><dd>' + esc(s.wd) + '</dd>'
    : '<dt>営業時間</dt><dd>平日 ' + esc(s.wd) + '<br>土日祝 ' + esc(s.we) + '</dd>';
  var addr = s.addr ? esc(s.addr) : '<span class="todo">要確認</span>';
  var tel = s.tel
    ? '<a href="tel:' + esc(s.tel.replace(/[^0-9+]/g, "")) + '" data-track="tel_click" data-store="' + esc(s.title) + '">' + esc(s.tel) + '</a>'
    : '<span class="todo">要確認</span>';
  var actions = s.addr
    ? '<div class="actions"><a class="btn btn-outline" href="' + esc(mapUrl(s.addr)) + '" target="_blank" rel="noopener" data-track="map_click" data-store="' + esc(s.title) + '">地図で見る</a></div>'
    : '';
  return '' +
    '<article class="card store" data-pref="' + esc(s.pref) + '">' +
      '<span class="store-pref">' + esc(s.pref) + '</span>' +
      '<h3>' + esc(s.title) + '</h3>' +
      '<dl>' +
        '<dt>住所</dt><dd>' + addr + '</dd>' +
        '<dt>電話</dt><dd>' + tel + '</dd>' +
        hours +
        '<dt>定休日</dt><dd>' + esc(s.off) + '</dd>' +
      '</dl>' +
      (s.note ? '<p class="note">※' + esc(s.note) + '</p>' : '') +
      actions +
    '</article>';
}

function renderDetail(p) {
  heroTitle.innerHTML = '<p class="title">提携店舗の優待</p>';
  var panels = p.perks.map(function (k) {
    return '' +
      '<div class="perk-panel">' +
        '<p class="perk-value"><span class="num">' + esc(k.value) + '</span><span class="unit">' + esc(k.unit) + '</span></p>' +
        '<p class="perk-label">' + esc(k.label) + '</p>' +
        '<p class="perk-sub">' + esc(k.sub) + '</p>' +
      '</div>';
  }).join("");

  var teamHtml = "";
  if (p.team) {
    var items = p.team.items.map(function (it) {
      var dd = it[0] === "対象競技の例"
        ? '<ul class="chips sport-chips">' + it[1].split(",").map(function (x) { return '<li class="sport-chip">' + esc(x.trim()) + '</li>'; }).join("") + '</ul>'
        : esc(it[1]);
      return '<div><dt>' + esc(it[0]) + '</dt><dd>' + dd + '</dd></div>';
    }).join("");
    teamHtml = '' +
      '<section class="section" data-section="team" aria-labelledby="team-title">' +
        '<h2 class="section-title" id="team-title">チームウェア・ユニフォームを注文するとき</h2>' +
        '<div class="card"><dl class="deflist">' + items + '</dl>' +
        (p.team.callout ? '<p class="callout">' + esc(p.team.callout) + '</p>' : '') +
        '</div>' +
      '</section>';
  }

  var detailsHtml = (p.details && p.details.length)
    ? '<section class="section" data-section="details" aria-labelledby="details-title">' +
        '<h2 class="section-title" id="details-title">店頭商品の割引について</h2>' +
        '<div class="card"><ul class="bullets">' + p.details.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join("") + '</ul></div>' +
      '</section>'
    : "";

  var prefs = prefsOf(p);
  var filterHtml = prefs.length >= 2
    ? '<div class="filter" role="group" aria-label="都道府県で絞り込む">' +
        ['すべて'].concat(prefs).map(function (pf, i) {
          var val = i === 0 ? "all" : pf;
          return '<button type="button" aria-pressed="' + (i === 0) + '" data-filter="' + esc(val) + '" data-track="store_filter" data-partner="' + esc(p.id) + '" data-pref="' + esc(val) + '">' + esc(pf) + '</button>';
        }).join("") +
      '</div>'
    : "";

  app.innerHTML = '' +
    '<a class="back" href="#top" data-tap="back_to_top">← 提携店舗の一覧へ</a>' +
    '<div class="detail-head">' +
      '<div><p class="partner-meta">' + esc(p.category) + '／' + esc(p.area) + '</p><h1>' + esc(p.name) + '</h1></div>' +
      '<span class="logo-box"><img src="' + esc(p.logo) + '" width="176" height="176" alt="" data-fallback="' + esc(p.name) + '"></span>' +
    '</div>' +

    '<section class="section" data-section="perks" aria-label="優待の内容"><div class="perk-panels">' + panels + '</div></section>' +

    '<section class="section" data-section="rules" aria-labelledby="rules-title">' +
      '<h2 class="section-title" id="rules-title">利用条件</h2>' +

        '<li>80SKIP公式LINEで獲得したMEMBER\'S CARDの画像を見せてください。</li>' +

      filterHtml +
      '<p class="store-count" id="store-count" aria-live="polite"></p>' +
      '<div class="stores" id="stores">' + p.stores.map(function (s) { return storeHtml(p, s); }).join("") + '</div>' +
    '</section>' +

    (p.url
      ? '<section class="section" data-section="site"><a class="btn btn-outline btn-block" href="' + esc(p.url) + '" target="_blank" rel="noopener" data-track="partner_site_click" data-partner="' + esc(p.id) + '">' + esc(p.name) + 'の公式サイト ↗</a></section>'

  });
}

function applyFilter(val) {
  var n = 0;
  app.querySelectorAll(".store").forEach(function (el) {
    var show = val === "all" || el.getAttribute("data-pref") === val;
    el.hidden = !show;
    if (show) n++;
  });
  app.querySelectorAll("[data-filter]").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.getAttribute("data-filter") === val));
  });
  var c = document.getElementById("store-count");
  if (c) c.textContent = n + "店舗";
}

function route(isInitial) {
  var id = location.hash.replace(/^#/, "");
  var p = findPartner(id);
  if (p) {
    heroLead.textContent = p.name + "で、MEMBER'S CARDの優待が受けられます。";
    renderDetail(p);
    document.title = p.name + "の優待｜80SKIP MEMBER'S CARD";
  } else {
    heroLead.textContent = "公式LINEのMEMBER'S CARDを見せると、提携店舗で優待が受けられます。";
    renderTop();
    document.title = "提携店舗の優待｜80SKIP MEMBER'S CARD";
  }
  if (!isInitial) {
    window.scrollTo(0, 0);
    app.focus({ preventScroll: true });
  }
  resetScrollDepth();
  track("page_view", {
    page_title: document.title,
    page_path: currentPath(),
    page_location: location.href
  });
  setTimeout(checkScrollDepth, 300);
}

if ("scrollRestoration" in history) history.scrollRestoration = "manual";
document.querySelectorAll("[data-line]").forEach(function (a) { a.href = LINE_URL; });
window.addEventListener("hashchange", function () { route(false); });
route(true);
</script>
